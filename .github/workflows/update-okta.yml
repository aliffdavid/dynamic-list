name: Update Okta and Cloudflare IP Ranges

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Okta IP list
        run: |
          python3 scripts/generate.py

      - name: Download Cloudflare IPv4 ranges
        run: |
          mkdir -p site/Cloudflare-ip-ranges
          curl -fsSL https://www.cloudflare.com/ips-v4/ \
            -o site/Cloudflare-ip-ranges/Cloudflare-ip-ranges.txt
            
      - name: Create Pages index
        run: |
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Firewall IP Ranges</title>
          </head>
          <body>
            <h1>Firewall IP Ranges</h1>

            <h2>Okta</h2>
            <p>
              <a href="/okta-ip-ranges/okta-ip-ranges.txt">
                Download Okta IP ranges
              </a>
            </p>

            <h2>Cloudflare</h2>
            <p>
              <a href="/Cloudflare-ip-ranges/Cloudflare-ip-ranges.txt">
                Download Cloudflare IP ranges
              </a>
            </p>

          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./site"

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
